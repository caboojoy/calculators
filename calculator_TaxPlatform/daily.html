<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일용직소득 계산기</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root { --accent: #8B5CF6; }
    body  { background: radial-gradient(ellipse 70% 40% at 50% 0%, rgba(139,92,246,0.07) 0%, var(--bg) 60%); }

    .sep-notice {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: color-mix(in srgb, #8B5CF6 10%, transparent);
      border: 1px solid color-mix(in srgb, #8B5CF6 30%, transparent);
      border-radius: var(--radius-sm);
      font-size: 0.83rem;
      color: #c4b5fd;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
<div class="page-wrap">

  <div class="page-header">
    <div class="breadcrumb">
      <a href="index.html">🏠 메인</a>
      <span class="sep">›</span>
      <span>일용직소득</span>
    </div>
    <div class="page-title">
      <div class="icon">🔨</div>
      <div>
        <h1>일용직소득 계산기</h1>
        <div class="subtitle">일당 기준 원천징수세액 · 분리과세</div>
      </div>
    </div>
  </div>

  <div class="sep-notice">
    ℹ️ 일용직 근로소득은 <strong>분리과세</strong>로 종합소득세에 합산되지 않습니다. (원천징수로 납세 완료)
  </div>

  <div class="card">
    <div class="card-title">소득 정보</div>

    <div class="field-row">
      <div class="field">
        <label>1일 급여 (일당) <span class="req">*</span></label>
        <input type="text" id="daily" placeholder="예) 150,000" inputmode="numeric">
      </div>
      <div class="field">
        <label>근무일수 <span class="req">*</span></label>
        <input type="text" id="days" placeholder="예) 20" inputmode="numeric">
      </div>
    </div>

    <div class="field">
      <label id="dailyDedLabel">일용직 근로소득공제</label>
      <input type="text" id="dedPerDay" inputmode="numeric">
      <div class="field-hint" id="dailyDedHint"></div>
    </div>
  </div>

  <button class="btn btn-primary" onclick="calculate()">🔨 일용직 세액 계산하기</button>

  <div class="result-card" id="resultCard">
    <div class="card-title">계산 결과</div>
    <div id="resultRows"></div>
    <div class="result-note" id="dailyResultNote"></div>
  </div>

  <div class="action-row" id="actionRow" style="display:none">
    <button class="btn btn-ghost" onclick="toggleJson()">{ } JSON 보기</button>
    <button class="btn btn-primary" onclick="saveResult()">💾 참고용으로 저장</button>
  </div>

  <pre class="json-block" id="jsonBlock"></pre>

  <div style="margin-top:12px;text-align:center">
    <a href="comprehensive.html" class="btn btn-ghost btn-sm">📊 종합소득세 계산기 →</a>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="shared.js"></script>
<script>
  const DAILY_DED_PER_DAY = TAX_RULES.deductions.dailyPerDay;
  const DAILY_TAX_RATE = TAX_RULES.rates.dailyIncomeTax;
  const DAILY_CREDIT_RATE = TAX_RULES.rates.dailyEarnedCredit;
  const LOCAL_TAX_RATE = TAX_RULES.rates.localTax;

  document.getElementById('dedPerDay').value = DAILY_DED_PER_DAY.toLocaleString('ko-KR');
  document.getElementById('dailyDedLabel').textContent = `일용직 근로소득공제 (일 ${Fmt.eok(DAILY_DED_PER_DAY)})`;
  document.getElementById('dailyDedHint').textContent = `기본값 ${Fmt.won(DAILY_DED_PER_DAY)}. 변경 시 직접 입력`;
  document.getElementById('dailyResultNote').textContent = `※ 일용직 근로소득세율 ${(DAILY_TAX_RATE * 100).toFixed(0)}% 적용. 분리과세이므로 종합소득세 합산 없음.`;

  ['daily','days','dedPerDay'].forEach(id => addCommaInput(document.getElementById(id)));

  let lastResult = null;

  function calculate() {
    const dailyWage = Fmt.parse(document.getElementById('daily').value);
    const days      = Fmt.parse(document.getElementById('days').value);
    const dedPerDay = Fmt.parse(document.getElementById('dedPerDay').value) || DAILY_DED_PER_DAY;

    if (!dailyWage || !days) { alert('일당과 근무일수를 입력해주세요.'); return; }

    const totalIncome = dailyWage * days;

    // 1일 단위로 계산 (일용직 세법 구조)
    const taxablePerDay  = Math.max(0, dailyWage - dedPerDay);
    const taxPerDay      = Math.floor(taxablePerDay * DAILY_TAX_RATE);   // 세율
    const creditPerDay   = Math.floor(taxPerDay * DAILY_CREDIT_RATE);    // 근로소득세액공제
    const finalTaxPerDay = Math.max(0, taxPerDay - creditPerDay);
    const totalTax       = finalTaxPerDay * days;
    const localTax       = Math.floor(totalTax * LOCAL_TAX_RATE);
    const totalWithLocal = totalTax + localTax;

    const taxableTotal = taxablePerDay * days;

    const rows = [
      ['일당',             Fmt.won(dailyWage)],
      ['근무일수',         `${days}일`],
      ['총 수입금액',       Fmt.won(totalIncome), true],
      ['일용직 근로소득공제 (일 × 일수)', `-${Fmt.won(dedPerDay * days)}`],
      ['과세대상 급여',     Fmt.won(taxableTotal), true],
      [`산출세액 (${(DAILY_TAX_RATE * 100).toFixed(0)}%)`,     Fmt.won(taxPerDay * days)],
      [`근로소득세액공제 (${(DAILY_CREDIT_RATE * 100).toFixed(0)}%)`, `-${Fmt.won(creditPerDay * days)}`],
      ['원천징수세액 (소득세)', Fmt.won(totalTax)],
      [`지방소득세 (${(LOCAL_TAX_RATE * 100).toFixed(0)}%)`, Fmt.won(localTax)],
    ];

    document.getElementById('resultRows').innerHTML =
      rows.map(([l, v, bold]) =>
        `<div class="result-row${bold?' total':''}"><span class="lbl">${l}</span><span class="val">${v}</span></div>`
      ).join('') +
      `<div class="result-row grand-total total">
        <span class="lbl">총 원천징수 세액</span>
        <span class="val">${Fmt.won(totalWithLocal)}</span>
      </div>
      <div class="result-row">
        <span class="lbl">실수령액</span>
        <span class="val" style="color:var(--success)">${Fmt.won(totalIncome - totalWithLocal)}</span>
      </div>`;

    lastResult = createTaxResult(
      'daily',
      totalIncome,
      taxableTotal,
      totalTax,
      false,  // 분리과세 → 종합소득세 합산 안 됨
      { dailyWage, days, dedPerDay, totalIncome, taxableTotal,
        taxPerDay, creditPerDay, finalTaxPerDay, totalTax, localTax }
    );

    document.getElementById('jsonBlock').innerHTML = syntaxHighlight(lastResult);
    document.getElementById('resultCard').classList.add('visible');
    document.getElementById('actionRow').style.display = 'flex';
    document.getElementById('resultCard').scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  function saveResult() {
    if (!lastResult) return;
    TaxStorage.save('daily', lastResult);
    showToast('✓ 일용직소득 저장 완료! (참고용)');
  }

  function toggleJson() { document.getElementById('jsonBlock').classList.toggle('visible'); }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function syntaxHighlight(obj) {
    return JSON.stringify(obj, null, 2)
      .replace(/("[\w_]+")\s*:/g, '<span class="json-key">$1</span>:')
      .replace(/:\s*(".*?")/g, ': <span class="json-str">$1</span>')
      .replace(/:\s*(\d+)/g, ': <span class="json-num">$1</span>')
      .replace(/:\s*(true|false)/g, ': <span class="json-bool">$1</span>');
  }
</script>
<!-- allcalcu:more-calculators -->
<nav class="ac-more" aria-label="다른 계산기">
  <a class="ac-more__link" href="../index.html">다른 계산기 보기 <span aria-hidden="true">→</span></a>
</nav>
<style>
  .ac-more { display: block; width: 100%; flex: 0 0 100%; clear: both; box-sizing: border-box; text-align: center; padding: 28px 16px 36px; position: relative; z-index: 1; }
  .ac-more__link { display: inline-flex; align-items: center; gap: 6px; padding: 10px 22px; border-radius: 999px; background: rgba(255,255,255,0.92); border: 1px solid rgba(33,150,201,0.35); color: #1b6fa0; font: 600 14px/1.4 'Noto Sans KR', system-ui, sans-serif; text-decoration: none; box-shadow: 0 2px 10px rgba(33,150,201,0.12); transition: border-color .2s, color .2s; }
  .ac-more__link:hover { border-color: #2196c9; color: #2196c9; }
</style>
<!-- /allcalcu:more-calculators -->
</body>
</html>
