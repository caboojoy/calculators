    <!DOCTYPE html>
    <html lang="ko">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>세계 시간 차이 계산기</title>
    <link rel="stylesheet" href="style.css" />
    </head>
    <body>
    <div class="wt-wrap">
        <div class="wt-header">
        <h1 class="wt-title">🌍 세계 시간 계산기</h1>
        <p class="wt-sub">기준 도시를 선택하고 비교할 도시를 추가하세요</p>
        </div>

        <!-- 기준 도시 카드 -->
        <div class="wt-base-card">
        <div class="wt-base-label">기준 도시</div>
        <div class="wt-base-top">
            <div>
            <div class="wt-base-city" id="base-city-name">서울</div>
            <div class="wt-base-date" id="base-date"></div>
            </div>
            <div class="wt-base-time" id="base-time">--:--:--</div>
        </div>
        <div class="wt-base-select">
            <select class="wt-select" id="base-select"></select>
        </div>
        </div>

        <!-- 비교 도시 목록 -->
        <div class="wt-cities" id="cities-list"></div>

        <!-- 도시 추가 -->
        <div class="wt-add-row">
        <select class="wt-select" id="add-select"></select>
        <button class="wt-add-btn" id="add-btn">+ 도시 추가</button>
        </div>

        <!-- 시차 요약 테이블 -->
        <div id="diff-section"></div>

        <!-- 업무 시간 타임라인 -->
        <div id="overlap-section"></div>
    </div>

    <script src="script.js"></script>
    <!-- allcalcu:more-calculators -->
<nav class="ac-more" aria-label="다른 계산기">
  <a class="ac-more__link" href="../index.html">다른 계산기 보기 <span aria-hidden="true">→</span></a>
</nav>
<style>
  .ac-more { display: block; width: 100%; flex: 0 0 100%; clear: both; box-sizing: border-box; text-align: center; padding: 28px 16px 36px; position: relative; z-index: 1; }
  .ac-more__link { display: inline-flex; align-items: center; gap: 6px; padding: 10px 22px; border-radius: 999px; background: rgba(255,255,255,0.92); border: 1px solid rgba(33,150,201,0.35); color: #1b6fa0; font: 600 14px/1.4 'Noto Sans KR', system-ui, sans-serif; text-decoration: none; box-shadow: 0 2px 10px rgba(33,150,201,0.12); transition: border-color .2s, color .2s; }
  .ac-more__link:hover { border-color: #2196c9; color: #2196c9; }
</style>
<!-- /allcalcu:more-calculators -->
</body>
    </html>
