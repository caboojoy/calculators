name = "camfx-proxy"
main = "worker.mjs"
compatibility_date = "2026-10-01"

# API 키는 여기에 쓰지 말고: npx wrangler secret put ANTHROPIC_API_KEY

[vars]
# 앱 주소 (쉼표로 여러 개). Vercel 미리보기 주소에서 테스트하려면 그 주소도 추가
ALLOWED_ORIGINS = "https://www.allcalcu.com,https://allcalcu.com"
# 로컬 개발용 http://localhost:* 허용. 배포 후에는 "0"
ALLOW_LOCALHOST = "1"
# 비전 모델 (교체 가능). 비용을 줄이려면 "claude-haiku-5-5" 등으로 바꿔 정확도를 비교하세요.
MODEL = "claude-opus-5-5"
# 선택: low | medium | high | xhigh | max (비우면 모델 기본값)
EFFORT = ""
# IP별 분당 요청 수 (isolate 메모리, 근사치)
PER_MINUTE_LIMIT = "10"
# KV 사용 시 일일 한도
DAILY_LIMIT_PER_IP = "100"
DAILY_LIMIT_TOTAL = "3000"
UPSTREAM_TIMEOUT_MS = "55000"

# 선택: 일일 한도용 KV — `npx wrangler kv namespace create RATE_KV` 후 id 를 넣고 주석 해제
# [[kv_namespaces]]
# binding = "RATE_KV"
# id = "<KV namespace id>"
